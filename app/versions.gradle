/*
 * Gets the version name from the latest Git tag
 */
import org.gradle.process.ExecOperations

ext.getNeoVersionName = { ->
    def execOps = project.services.get(ExecOperations)
    def stdout = new ByteArrayOutputStream()
    def execResult = execOps.exec {
        commandLine('bash', '-c', 'git describe --tags')
        standardOutput = stdout
        ignoreExitValue = true
    }
    ext.v = stdout.toString().trim()
    if (execResult.exitValue != 0 || !ext.v) {
        // Fallback for environments without git metadata (or no tags)
        return "0.0.0"
    }
    if (v.contains("-")) {
        ext.v = ext.v.substring(0, ext.v.indexOf('-'))
    }
    return ext.v
}

ext.getNeoVersionCode = { ->
    def execOps = project.services.get(ExecOperations)
    def stdout = new ByteArrayOutputStream()
    def execResult = execOps.exec {
        commandLine('bash', '-c', 'git tag | wc -l')
        standardOutput = stdout
        ignoreExitValue = true
    }
    def s = stdout.toString().trim()
    if (execResult.exitValue != 0 || !s.isInteger()) {
        // Fallback for environments without git metadata (or no tags)
        return 1
    }
    return s.toInteger()
}
